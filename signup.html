<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign up</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <a href="/">
          <img
            src="https://zerodha.com/static/images/logo.svg"
            alt="zerodha logo"
        /></a>
      </div>
      <div class="header-right">
        <a href="signup.html">signup</a>
        <a href="#">about</a>
        <a href="#">products</a>
        <a href="#">pricing</a>
        <a href="#">support</a>

        <i class="fa-solid fa-bars"></i>
       
      </div>
    </div>
    <div class="container">
      <p class="para1">Open a free demat and trading account online</p>
      <br />
      <p class="para2">
        Start investing brokerage free and join a community of 1.6+ crore
        investors and traders
      </p>
      <br />
    </div>
    <div class="main">
      <div class="imag1">
        <img
          src="https://zerodha.com/static/images/account_open.svg"
          alt="signup image"
        />
      </div>
      <div class="signup">
        <form>
          <label for="mob1" class="sign">Signup now</label>
          <p>Or track your existing application</p>

          <div class="entry">
            <!-- image flag ----------------- -->
              <div class="india"><img src="https://zerodha.com/static/images/india-flag.svg" alt="india"
                 height="30px">+91 
              </div>
                <!-- <img src="https://zerodha.com/static/images/india-flag.svg" alt="india" height="30px"> -->
               <!-- <select><option></option></select> -->

             <!-- placeholder -->
              <div class="mob">

              <input
                type="number"
                id="mob1"
                class="mob1"
                name="mobile"
                value="mob"
                placeholder="Enter Mobile Number"
              />
              </div>
            </div>
            <div class="submit"> Get OTP
                <button type="submit">Get OTP</button>
            </div>
            
            

          </div>
        </form>
      </div>
    </div>
  </body>
</html>
